# =============================================================================
# Contract Intelligence Platform - full local stack
#
#   podman compose up -d --build      (or: make up)
#   docker compose up -d --build
#
# Runs on Podman and Docker unchanged. `make up` picks Podman when it is on PATH.
#
# Podman notes
# ------------
# * Bind mounts carry `:z` so they are readable under SELinux (Fedora, RHEL,
#   CentOS). Without it a rootless container cannot read ./infra and the symptom
#   is a config file that "does not exist" while `ls` shows it plainly. Docker
#   and non-SELinux hosts ignore the flag.
# * Every published port is above 1024, so rootless Podman can bind them all
#   without extra privilege.
# * The API and the workers run as an unprivileged user inside the image,
#   which composes correctly with Podman's user-namespace mapping.
#
# * Every published host port is overridable (REDIS_PORT, BACKEND_PORT, ...).
#   Podman fails a container outright when a host port is taken rather than
#   picking another, and a dev box running several stacks will have one taken.
# * Container names are prefixed with ${COMPOSE_PROJECT:-cip}. Podman fails hard
#   on a name collision, and a machine running several stacks will have one.
#   Set COMPOSE_PROJECT=cip2 to run a second copy side by side.
#
# The API, each worker pool, the queue dispatcher and the frontend are separate
# deployables sharing Postgres + Redis + object storage, so a pool can be scaled
# on its own:  podman compose up -d --scale worker-ai=4
# =============================================================================

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  DEBUG: ${DEBUG:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  # An explicit DATABASE_URL wins; otherwise the bundled Postgres service is
  # composed from the POSTGRES_* values. Previously this was hardcoded to the
  # `postgres` service, so setting DATABASE_URL in .env appeared to work and was
  # silently ignored - the app kept talking to the container while the operator
  # believed it had been repointed at an external database.
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-cip}:${POSTGRES_PASSWORD:-carbonadmin}@postgres:5432/${POSTGRES_DB:-cip}}
  # Schema the application's tables live in. Empty means `public`. Set this when
  # the database is shared with another application that already owns table names
  # we also use - see DatabaseSettings.schema_name.
  DB_SCHEMA: ${DB_SCHEMA:-}
  DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-60000}
  # Must exceed the slowest stage. A stage runs in one transaction and
  # ai_extraction spends minutes in provider calls, so the connection is idle
  # *in transaction* throughout - set this too low and Postgres kills the
  # session mid-extraction, which surfaces as "no clauses could be identified".
  DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-1800000}
  REDIS_URL: redis://redis:6379/0
  # Reject a re-upload of a file already in the project. Temporarily off while
  # the document pipeline is being iterated on - re-running the same test PDF is
  # the workflow. Defaulted here rather than only in .env.example because
  # deploy.sh keeps an existing server .env, so a new key added there never
  # reaches a deployment that has already been provisioned once.
  UPLOAD_DUPLICATE_CHECK: ${UPLOAD_DUPLICATE_CHECK:-false}
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-openssl-rand-hex-32}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  # The `Secure` flag on the refresh cookie, defaulted to its secure value.
  #
  # Forwarded because this block is an allow-list: without the line, setting
  # AUTH_COOKIE_SECURE in .env does nothing at all, which is the same trap the
  # OIDC and QUEUE_* blocks below were written to explain.
  #
  # It matters here because a browser silently discards a `Secure` cookie over
  # plain HTTP, and this stack publishes plain HTTP. The symptom is not an error:
  # signing in works, and then a page reload logs you out, because the access token
  # lived in memory while the refresh cookie was never stored at all. Set it false
  # only on a deployment with no TLS, knowing the refresh token then travels in
  # cleartext.
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
  # --- Microsoft Entra SSO ---
  #
  # This block is an allow-list, not a passthrough: a key absent here never
  # reaches the container however carefully .env is edited. Turning SSO on by
  # setting OIDC_ENABLED=true on the server therefore did nothing visible, and
  # /auth/methods kept reporting it disabled - which reads as a code fault
  # rather than a missing line in compose.
  #
  # No client secret: the registration is a public client and PKCE authenticates
  # the code exchange. AZURE_AD_CLIENT_SECRET is still forwarded so a
  # confidential registration works without another compose edit.
  OIDC_ENABLED: ${OIDC_ENABLED:-false}
  OIDC_PROVIDER: ${OIDC_PROVIDER:-microsoft}
  AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-}
  AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
  AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET:-}
  # Both must be the address a *browser* uses. Defaulting them to localhost is
  # right for a laptop and wrong for every deployment, which is why the deploy
  # sets them explicitly.
  OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:8000/api/v1/auth/oidc/callback}
  OIDC_POST_LOGIN_REDIRECT: ${OIDC_POST_LOGIN_REDIRECT:-http://localhost:5173/auth/callback}
  OIDC_SILENT_FIRST: ${OIDC_SILENT_FIRST:-true}
  OIDC_AUTO_PROVISION_USERS: ${OIDC_AUTO_PROVISION_USERS:-true}
  OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
  OIDC_ALLOWED_EMAIL_DOMAINS: ${OIDC_ALLOWED_EMAIL_DOMAINS:-}
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
  STORAGE_CONTAINER: ${STORAGE_CONTAINER:-contracts}
  # Two endpoints, deliberately. The app reaches MinIO by service name on the
  # compose network; the browser cannot resolve that name, so presigned URLs are
  # signed for the host-published address instead. Without the second one the PDF
  # viewer silently shows nothing while every server-side check reports healthy.
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://127.0.0.1:9000}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
  S3_USE_PATH_STYLE: "true"
  # --- parsing ---
  # `idoc` is the active adapter: the in-house layout service, which returns real
  # layout roles and coordinates. `pymupdf` is the local fallback. Docling is not
  # used by this deployment and is not an accepted value.
  ACTIVE_PARSER: ${ACTIVE_PARSER:-idoc}
  # `live` calls the PDF service; `fixture` replays a recorded response and is
  # for offline development and tests. Defaulting to fixture meant a running
  # deployment could not process any document it had not already seen - the
  # upload parsed nothing and failed with "no recorded response for this
  # document". The response is cached in object storage by file hash, so live
  # sends a given PDF to the vendor once, ever.
  PARSER_MODE: ${PARSER_MODE:-live}
  PARSER_FIXTURE_DIR: ${PARSER_FIXTURE_DIR:-/app/storage/fixtures/parser}
  IDOC_ENDPOINT: ${IDOC_ENDPOINT:-https://devidocapi2.iriscarbon.com/pdf/upload-pdf-to-json}

  # Absolute, and under the shared storage volume, deliberately. The default is
  # the relative `evaluation-results`, which the benchmark CLI writes relative to
  # *its* working directory and the API reads relative to *its* own - so running
  # the two from different directories makes the Retrieval Quality screen report
  # "no benchmark has been recorded" while the files sit one directory away, with
  # no error anywhere. An absolute path removes the whole class of confusion.
  EVALUATION_RESULTS_DIR: ${EVALUATION_RESULTS_DIR:-/app/storage/evaluation-results}

  # `ACTIVE_PARSER=pdfextract` runs a local pdf_text_extractor checkout instead of
  # the layout service. It emits the same Azure prebuilt-layout payloads, so the
  # document pipeline is unaffected by the swap.
  #
  # In a container the path must be a *mounted* checkout with its virtualenv built
  # for this image's platform - a .venv created on a Windows host will not run
  # here. Left empty by default, which makes the parser refuse with an actionable
  # error rather than appear to work.
  PDFEXTRACT_PATH: ${PDFEXTRACT_PATH:-}
  PDFEXTRACT_BACKEND: ${PDFEXTRACT_BACKEND:-baseline}
  PDFEXTRACT_DPI: ${PDFEXTRACT_DPI:-300}
  PDFEXTRACT_TIMEOUT_SECONDS: ${PDFEXTRACT_TIMEOUT_SECONDS:-1800}
  # Reaches the extractor over HTTP instead of running it as a subprocess. Absent
  # from this block, `PDFEXTRACT_URL` in .env never reached the container and the
  # adapter silently fell back to the subprocess path it could not run - the same
  # allow-list trap as the OIDC block above.
  PDFEXTRACT_URL: ${PDFEXTRACT_URL:-}

  # The iDoc layout service. `IDOC_ENDPOINT` was forwarded but its API key was not,
  # so a deployment needing one authenticated against nothing and every parse 401'd.
  IDOC_API_KEY: ${IDOC_API_KEY:-}
  IDOC_API_KEY_HEADER: ${IDOC_API_KEY_HEADER:-X-API-Key}
  IDOC_TIMEOUT_SECONDS: ${IDOC_TIMEOUT_SECONDS:-600}
  IDOC_VERIFY_TLS: ${IDOC_VERIFY_TLS:-true}

  # --- inference and embeddings ---
  # This stack runs end to end with no LLM vendor account and no API key: both
  # providers default to `mock`, and neither the `anthropic` nor the `openai`
  # package is installed in the base image.
  #
  # What that costs you: mock extractions are SYNTHESISED rather than read from the
  # contract, and mock embeddings are not semantically meaningful, so clause
  # attributes, risk scores and semantic search are demo-grade. The API logs a
  # warning on every start while either is active, and `APP_ENV=production` refuses
  # to boot unless ALLOW_MOCK_AI is set deliberately.
  #
  # To use a real provider, set LLM_PROVIDER/EMBEDDING_PROVIDER and the matching key
  # below, and build the image with the `ai` extra.
  LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
  ALLOW_MOCK_AI: ${ALLOW_MOCK_AI:-false}
  # Model names used only when a real provider is selected; inert under `mock`.
  #
  # All three tiers must be forwarded. Compose passes only the variables named
  # here, so a tier left out of this block silently falls back to its Pydantic
  # default no matter what .env says - and the default is an Anthropic-native
  # model id, which a gateway like OpenRouter rejects with
  # `<model> is not a valid model ID`. Every simple-tier call then 400s, which is
  # most of the pipeline.
  LLM_MODEL: ${LLM_MODEL:-claude-opus-5}
  LLM_MODEL_SIMPLE: ${LLM_MODEL_SIMPLE:-claude-haiku-4-5}
  LLM_MODEL_COMPLEX: ${LLM_MODEL_COMPLEX:-claude-opus-5}
  # Empty falls back to LLM_MODEL_COMPLEX - see ModelRouter._model_for_tier.
  LLM_MODEL_REASONING: ${LLM_MODEL_REASONING:-}
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-4096}
  # The streaming ceiling was missing here, so setting it in .env did nothing in a
  # container - the same allow-list trap as the QUEUE_* and RETRIEVAL_* blocks. It
  # matters because a ceiling above the model's limit fails every streamed Copilot
  # answer while non-streaming keeps working. No `:-` default: empty means "not
  # configured", so the built-in applies.
  LLM_MAX_OUTPUT_TOKENS_STREAMING: ${LLM_MAX_OUTPUT_TOKENS_STREAMING:-}
  # Per-tier deadlines: a simple-tier call that has not answered inside its
  # window is not going to, and holding a worker slot for the reasoning-tier
  # timeout starves the pool behind it.
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
  LLM_TIMEOUT_SECONDS_SIMPLE: ${LLM_TIMEOUT_SECONDS_SIMPLE:-90}
  LLM_TIMEOUT_SECONDS_COMPLEX: ${LLM_TIMEOUT_SECONDS_COMPLEX:-300}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
  LLM_RETRY_BACKOFF_SECONDS: ${LLM_RETRY_BACKOFF_SECONDS:-1.0}
  # `none` for models behind an OpenAI-compatible gateway that do not implement
  # the strict json_schema response format - see LLMSettings.llm_structured_output.
  LLM_STRUCTURED_OUTPUT: ${LLM_STRUCTURED_OUTPUT:-json_schema}
  # NVIDIA Nemotron 3 Embed 1B. 2048 is the model's real output width, and
  # `halfvec` is required rather than preferred: pgvector's HNSW index stops at
  # 2000 dimensions for the `vector` type, so a vector(2048) column cannot be
  # indexed and every similarity search becomes a sequential scan.
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
  EMBEDDING_STORAGE: ${EMBEDDING_STORAGE:-halfvec}
  EMBEDDING_VERIFY_ON_STARTUP: ${EMBEDDING_VERIFY_ON_STARTUP:-true}
  NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
  NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
  # All optional. Left empty the platform stays on the mock providers.
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  # Azure OpenAI. The embedding block is separate because embeddings routinely
  # live on a different resource from the chat model; each falls back to the
  # AZURE_OPENAI_* value when unset, so one resource for both needs nothing here.
  AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
  AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
  AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
  AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
  AZURE_OPENAI_EMBEDDING_ENDPOINT: ${AZURE_OPENAI_EMBEDDING_ENDPOINT:-}
  AZURE_OPENAI_EMBEDDING_API_KEY: ${AZURE_OPENAI_EMBEDDING_API_KEY:-}
  AZURE_OPENAI_EMBEDDING_API_VERSION: ${AZURE_OPENAI_EMBEDDING_API_VERSION:-2024-02-01}
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  GEMINI_MODEL_SIMPLE: ${GEMINI_MODEL_SIMPLE:-gemini-2.5-flash-lite}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  # Points the OpenAI-compatible client at a gateway instead of OpenAI itself
  # (OpenRouter, Together, vLLM, LM Studio). Empty means OpenAI.
  #
  # Must be forwarded explicitly: compose passes only the variables named here,
  # so omitting it lets the key through while silently dropping the endpoint -
  # every request then goes to api.openai.com and fails with "Incorrect API key
  # provided", which reads like a bad key rather than a missing base URL.
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}

  # --- Queue ---
  #
  # None of this reached the backend before: the whole QUEUE_* group was set on
  # the `queue` service only, so `QUEUE_DRIVER` in .env chose nothing and the
  # backend always built the BullMQ driver whatever the file said. Same failure
  # shape as the OIDC block below - an allow-list that silently drops a key reads
  # as a code fault, not a missing compose line.
  #
  # `postgres` needs neither Redis nor the `queue` service; run the stage worker
  # instead: `python -m app.cli worker`.
  QUEUE_DRIVER: ${QUEUE_DRIVER:-bullmq}
  QUEUE_PREFIX: ${QUEUE_PREFIX:-cip}
  QUEUE_DISPATCHER_URL: ${QUEUE_DISPATCHER_URL:-http://queue:9100}
  QUEUE_STAGE_TIMEOUT_MS: ${QUEUE_STAGE_TIMEOUT_MS:-1800000}
  QUEUE_MAX_ATTEMPTS: ${QUEUE_MAX_ATTEMPTS:-3}
  QUEUE_BACKOFF_MS: ${QUEUE_BACKOFF_MS:-5000}
  QUEUE_DLQ_NAME: ${QUEUE_DLQ_NAME:-dead-letter}

  # One per stage in STAGE_ORDER. The two AI stages are capped at 4 because each
  # makes a dozen or more model calls per document; more parallel documents just
  # queue behind the same gateway. These were the Node dispatcher's built-in
  # defaults, and the Python worker has to carry them or the caps are lost.
  WORKER_CONCURRENCY_VALIDATION: ${WORKER_CONCURRENCY_VALIDATION:-10}
  WORKER_CONCURRENCY_PARSER: ${WORKER_CONCURRENCY_PARSER:-20}
  WORKER_CONCURRENCY_DOCPIPELINE: ${WORKER_CONCURRENCY_DOCPIPELINE:-4}
  WORKER_CONCURRENCY_EXTRACTION: ${WORKER_CONCURRENCY_EXTRACTION:-4}
  WORKER_CONCURRENCY_EMBEDDING: ${WORKER_CONCURRENCY_EMBEDDING:-15}
  WORKER_CONCURRENCY_INDEXING: ${WORKER_CONCURRENCY_INDEXING:-5}
  WORKER_CONCURRENCY_EXPORT: ${WORKER_CONCURRENCY_EXPORT:-4}

  # --- Retrieval tuning ---
  #
  # None of this group reached the backend before, so every RETRIEVAL_* line in
  # .env was inert in a container - the same allow-list trap as the QUEUE_* and
  # OIDC blocks above.
  #
  # Deliberately no `:-` defaults on the similarity floors. Compose interpolates
  # an unset variable to the empty string rather than omitting it, and the
  # backend now reads a blank as "not configured" (see
  # RetrievalSettings._blank_means_unset), so these forward an operator's value
  # when there is one and otherwise leave the tuned per-level defaults
  # (0.35 document / 0.45 clause / 0.40 chunk) untouched. Giving the base a
  # literal default here would be worse than omitting it: a value counts as
  # explicitly set, which flattens all three levels onto it.
  RETRIEVAL_MIN_SIMILARITY: ${RETRIEVAL_MIN_SIMILARITY:-}
  RETRIEVAL_MIN_SIMILARITY_DOCUMENT: ${RETRIEVAL_MIN_SIMILARITY_DOCUMENT:-}
  RETRIEVAL_MIN_SIMILARITY_CLAUSE: ${RETRIEVAL_MIN_SIMILARITY_CLAUSE:-}
  RETRIEVAL_MIN_SIMILARITY_CHUNK: ${RETRIEVAL_MIN_SIMILARITY_CHUNK:-}
  # The rest of the group, each defaulted to its current Pydantic value so that
  # adding them here changes nothing on its own.
  RETRIEVAL_MAX_DOCUMENTS: ${RETRIEVAL_MAX_DOCUMENTS:-25}
  RETRIEVAL_MAX_CLAUSES: ${RETRIEVAL_MAX_CLAUSES:-40}
  RETRIEVAL_MAX_CHUNKS: ${RETRIEVAL_MAX_CHUNKS:-20}
  RETRIEVAL_TIMEOUT_SECONDS: ${RETRIEVAL_TIMEOUT_SECONDS:-20}
  RERANK_TOP_K: ${RERANK_TOP_K:-20}
  CONTEXT_TOKEN_BUDGET: ${CONTEXT_TOKEN_BUDGET:-24000}
  COPILOT_SIMILARITY_THRESHOLD: ${COPILOT_SIMILARITY_THRESHOLD:-0.45}
  COPILOT_DOCTYPE_CONFIDENCE_THRESHOLD: ${COPILOT_DOCTYPE_CONFIDENCE_THRESHOLD:-0.75}

  # --- Uploads: Word and archive support ---
  #
  # LibreOffice must be present in the image for DOC/DOCX uploads to convert.
  # Left empty the adapter searches PATH and the usual install locations, so an
  # image that installs libreoffice needs nothing set here.
  ALLOWED_FILE_TYPES: ${ALLOWED_FILE_TYPES:-pdf,doc,docx,zip}
  # Was missing here, so the API accepted files the parser would later refuse -
  # stored and queued, then failed at the extractor, which caps uploads at 50MB.
  MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
  LIBREOFFICE_PATH: ${LIBREOFFICE_PATH:-}
  CONVERSION_TIMEOUT_SECONDS: ${CONVERSION_TIMEOUT_SECONDS:-180}
  MAX_ARCHIVE_MEMBERS: ${MAX_ARCHIVE_MEMBERS:-500}
  MAX_ARCHIVE_UNCOMPRESSED_MB: ${MAX_ARCHIVE_UNCOMPRESSED_MB:-2048}

  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me-internal-token}
  OTEL_ENABLED: ${OTEL_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@irisregtech.com}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Abc@1234}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------- datastores
  postgres:
    # Must match the major version of any existing pgdata volume: a server
    # refuses to start on a data directory written by a different major, and
    # the error reads like corruption rather than a version mismatch.
    image: pgvector/pgvector:pg${POSTGRES_MAJOR:-17}
    container_name: ${COMPOSE_PROJECT:-cip}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cip_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cip}
      # Tuned for vector workloads on a dev box.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_parallel_workers_per_gather=4
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cip} -d ${POSTGRES_DB:-cip}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT:-cip}-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  minio:
    image: minio/minio:latest
    container_name: ${COMPOSE_PROJECT:-cip}-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${STORAGE_CONTAINER:-contracts} &&
      mc mb --ignore-existing local/${STORAGE_CONTAINER:-contracts}-artifacts &&
      mc mb --ignore-existing local/${STORAGE_CONTAINER:-contracts}-exports &&
      echo 'minio buckets ready'"
    restart: "no"

  # --------------------------------------------------------------- migrations
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: ${COMPOSE_PROJECT:-cip}-migrate
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.cli", "migrate", "--seed"]
    restart: "no"
    logging: *default-logging

  # ---------------------------------------------------------------- API layer
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: ${COMPOSE_PROJECT:-cip}-backend
    environment:
      <<: *backend-env
      OTEL_SERVICE_NAME: cip-backend
      # Under `--profile nvidia`, EMBEDDING_PROVIDER is exported as `nvidia` by
      # `make nvidia-up` (or set in .env). Startup validation then probes the
      # endpoint and refuses to boot on a bad configuration.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - storagedata:/var/lib/cip/storage
  # -------------------------------------------------------- queue dispatcher
  # Node/BullMQ is a logic-free dispatch shim: it pulls a job and calls the
  # Python stage service over internal HTTP (see §1.2).
  queue:
    build:
      context: ./queue
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT:-cip}-queue
    environment:
      NODE_ENV: ${APP_ENV:-development}
      REDIS_URL: redis://redis:6379/0
      QUEUE_PREFIX: ${QUEUE_PREFIX:-cip}
      INTERNAL_API_BASE_URL: http://backend:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me-internal-token}
      QUEUE_STAGE_TIMEOUT_MS: ${QUEUE_STAGE_TIMEOUT_MS:-1800000}
      QUEUE_MAX_ATTEMPTS: ${QUEUE_MAX_ATTEMPTS:-3}
      QUEUE_BACKOFF_MS: ${QUEUE_BACKOFF_MS:-5000}
      # The Node dispatcher reads these as WORKER_CONCURRENCY_<STAGE>. Only the
      # stages in STAGE_ORDER are listed; the retired ones took knobs that
      # tuned queues nothing dispatches.
      WORKER_CONCURRENCY_VALIDATION: ${WORKER_CONCURRENCY_VALIDATION:-10}
      WORKER_CONCURRENCY_PARSER: ${WORKER_CONCURRENCY_PARSER:-20}
      WORKER_CONCURRENCY_DOCPIPELINE: ${WORKER_CONCURRENCY_DOCPIPELINE:-4}
      WORKER_CONCURRENCY_EXTRACTION: ${WORKER_CONCURRENCY_EXTRACTION:-4}
      WORKER_CONCURRENCY_EMBEDDING: ${WORKER_CONCURRENCY_EMBEDDING:-15}
      WORKER_CONCURRENCY_INDEXING: ${WORKER_CONCURRENCY_INDEXING:-5}
      WORKER_CONCURRENCY_EXPORT: ${WORKER_CONCURRENCY_EXPORT:-4}
      OTEL_SERVICE_NAME: cip-queue
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "${QUEUE_PORT:-9100}:9100" # queue metrics + admin introspection
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------- worker services
  # Stage worker pools run the same image as the API but expose only the
  # internal stage endpoints. Scale independently: `docker compose up -d
  # --scale worker-parser=4`.
  worker-parser:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    environment:
      <<: *backend-env
      OTEL_SERVICE_NAME: cip-worker-parser
      WORKER_ROLE: parser
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.worker_app:app", "--host", "0.0.0.0", "--port", "8001"]
    # Overrides the image's HEALTHCHECK, which probes 8000 - the API's port. A
    # worker serves `app.worker_app` on 8001, so the inherited check can never
    # pass and every worker reports `unhealthy` while processing jobs perfectly
    # well. A health signal that is always red is worse than none: it trains
    # everyone to ignore the column that is supposed to show a real outage.
    healthcheck: &worker-healthcheck
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/healthz', timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - storagedata:/var/lib/cip/storage
  worker-ai:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    environment:
      <<: *backend-env
      OTEL_SERVICE_NAME: cip-worker-ai
      WORKER_ROLE: ai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.worker_app:app", "--host", "0.0.0.0", "--port", "8001"]
    healthcheck: *worker-healthcheck
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - storagedata:/var/lib/cip/storage
  # There was a `scheduler` service here - a bare sweep loop running
  # `python -m app.cli scheduler` for alerts, stalled jobs and export retention.
  #
  # Those sweeps now run inside the worker pools above (see `worker_app.lifespan` and
  # `app.orchestrator.maintenance`), behind a Postgres advisory lock that keeps them to
  # one worker per tick however many are running. That removes a container and, more
  # usefully, removes a single point of failure: a lost scheduler took alert evaluation
  # with it silently, whereas the sweeps now survive as long as any worker does.
  #
  # `WORKER_MAINTENANCE=false` plus `python -m app.cli scheduler` splits them back out
  # if a deployment prefers that. Nothing about this is BullMQ's `QueueScheduler`, which
  # this queue has never used and which v5 does not have.

  # ------------------------------------------------------------ nvidia profile
  #
  #   docker compose --profile nvidia up embedding-check
  #
  # A gate, not a service. It runs the same probe the API runs at startup and exits
  # non-zero if NVIDIA is unreachable, the credentials are rejected, or the model's
  # dimension disagrees with the schema - so a bad configuration fails here, in
  # seconds, instead of on stage seven of the first upload.
  #
  # The default stack does not include it: `EMBEDDING_PROVIDER=mock` needs no vendor
  # account, and `docker compose up` must keep working with no credentials at all.
  embedding-check:
    profiles: ["nvidia"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: ${COMPOSE_PROJECT:-cip}-embedding-check
    environment:
      <<: *backend-env
      EMBEDDING_PROVIDER: nvidia
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      EMBEDDING_STORAGE: ${EMBEDDING_STORAGE:-halfvec}
      # Plain substitution, NOT `${NVIDIA_API_KEY:?...}`. podman-compose evaluates
      # the required-variable form for every service at parse time, including ones
      # behind an inactive profile - so a `:?` here breaks `podman compose up` for
      # the default stack, which needs no NVIDIA key at all. The probe below fails
      # with a clearer message anyway.
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        python -m app.tools.embedding_probe &&
        python -m app.tools.verify_pgvector
    restart: "no"
    logging: *default-logging

  # ------------------------------------------------------------------ frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        # Same-origin by default: nginx proxies /api to the backend, so the
        # HttpOnly refresh cookie is a first-party cookie. Pointing this at
        # http://localhost:8000 would make every API call cross-origin and put
        # that cookie at the mercy of SameSite=None plus CORS credentials.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_ENABLE_MICROSOFT_SSO: ${VITE_ENABLE_MICROSOFT_SSO:-false}
        API_HOST: backend
        API_PORT: "8000"
        # nginx also proxies object storage, so a presigned download URL can be
        # same-origin rather than needing MinIO published on its own port. The
        # bucket name is the proxied path, so the two must agree.
        STORAGE_HOST: minio
        STORAGE_PORT: "9000"
        STORAGE_BUCKET: ${STORAGE_CONTAINER:-cip-documents}
    container_name: ${COMPOSE_PROJECT:-cip}-frontend
    ports:
      # The container serves on 8080 and runs as an unprivileged user.
      # The container port is a variable because the dev override runs Vite on
      # 5173 while the runtime image serves nginx on 8080. Overriding `ports` in
      # the override file would *append* a second binding on the same host port,
      # which fails to start - so the switch is made here, once.
      - "${FRONTEND_PORT:-5173}:${FRONTEND_TARGET_PORT:-5173}"
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging

  # ------------------------------------------------------------ observability
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: ${COMPOSE_PROJECT:-cip}-otel
    command: ["--config=/etc/otel/config.yaml"]
    environment:
      # The collector config stamps this onto every span as
      # `deployment.environment`. It has a default in the config file so an unset
      # value cannot stop the collector booting, but passing it here is what makes
      # the label actually correct per deployment.
      APP_ENV: ${APP_ENV:-development}
    volumes:
      - ./infra/otel/collector-config.yaml:/etc/otel/config.yaml:ro,z
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"   # OTLP gRPC
      - "${OTLP_HTTP_PORT:-4318}:4318"   # OTLP HTTP
      - "${OTEL_METRICS_PORT:-8889}:8889"   # Prometheus scrape of collector-internal metrics
    restart: unless-stopped
    logging: *default-logging

  prometheus:
    image: prom/prometheus:latest
    container_name: ${COMPOSE_PROJECT:-cip}-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    container_name: ${COMPOSE_PROJECT:-cip}-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
      - grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    logging: *default-logging

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ${COMPOSE_PROJECT:-cip}-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_PORT:-16686}:16686"
    restart: unless-stopped
    logging: *default-logging

volumes:
  # Document bytes when STORAGE_PROVIDER=local. Without it the files live in the
  # container's writable layer and every recreate loses them - and `storage_path`
  # in the database still points at them, so the viewer 404s on documents the row
  # says exist.
  storagedata:
  pgdata:
  redisdata:
  miniodata:
  promdata:
  grafanadata:
