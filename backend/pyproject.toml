[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cip-backend"
version = "1.0.0"
description = "Contract Intelligence Platform - FastAPI backend, pipeline and AI services"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Base install: API + pipeline control plane + relational/vector data access.
# Heavy AI/parser wheels live in optional extras and are imported lazily so the
# API image stays small and a missing extra degrades to a clear error, never a
# crash on import.
dependencies = [
  # --- web ---
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "gunicorn>=23.0",
  "python-multipart>=0.0.12",
  "sse-starlette>=2.1",
  # --- validation / config ---
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "orjson>=3.10",
  # --- data ---
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "psycopg[binary]>=3.2",        # sync driver for Alembic
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "redis>=5.2",
  # --- security ---
  "pyjwt>=2.10",
  "argon2-cffi>=23.1",
  "bcrypt>=4.2",
  "cryptography>=43.0",
  # --- clients / resilience ---
  "httpx>=0.27",
  "tenacity>=9.0",
  # --- observability ---
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-grpc>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
  "opentelemetry-instrumentation-redis>=0.49b0",
  "opentelemetry-instrumentation-httpx>=0.49b0",
  # --- ops ---
  "typer>=0.13",
  "apscheduler>=3.10",
  # --- export ---
  "xlsxwriter>=3.2",
  # --- misc ---
  "python-dateutil>=2.9",
  # NB: no tiktoken. It is an OpenAI tokeniser and does not match Claude's, so a
  # count taken with it would be wrong for the provider this platform defaults to.
  # Token accounting comes from the provider's own usage figures - see
  # `app/ai/llm/`.
]

[project.optional-dependencies]
# Inference + embedding providers. Install only what the deployment uses.
ai = [
  "anthropic>=0.40",
  "openai>=1.55",
]
# Local embedding / re-ranking models (pulls torch - large).
local-ml = [
  "sentence-transformers>=3.3",
]
# Agentic pipeline orchestration (optional; the orchestrator works without it).
graph = [
  "langgraph>=0.2.45",
  "langchain-core>=0.3.21",
]
# Document parsing + OCR.
parsers = [
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "pytesseract>=0.3.13",
  "pillow>=11.0",
]
# Azure-flavoured deployment (Blob storage + Document Intelligence + AAD).
azure = [
  "azure-storage-blob>=12.24",
  "azure-identity>=1.19",
  "azure-ai-documentintelligence>=1.0.0b4",
]
# S3 / MinIO object storage.
s3 = [
  "aioboto3>=13.2",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "pytest-mock>=3.14",
  "httpx>=0.27",
  "asgi-lifespan>=2.1",
  "faker>=33.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-python-dateutil",
  "freezegun>=1.5",
]

[project.scripts]
cip = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

# -----------------------------------------------------------------------------
# Ruff
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
  "E", "W",     # pycodestyle
  "F",          # pyflakes
  "I",          # isort
  "N",          # pep8-naming
  "UP",         # pyupgrade
  "B",          # bugbear
  "C4",         # comprehensions
  "SIM",        # simplify
  "ASYNC",      # async correctness
  "S",          # bandit security
  "BLE",        # blind except
  "RUF",
]
ignore = [
  "E501",    # line length is handled by the formatter
  "B008",    # FastAPI Depends() in defaults is idiomatic
  "S101",    # asserts are fine in tests
  # Ambiguous-unicode checks. Deliberately off: the extraction layer has to match
  # the typographic quotes, dashes and non-breaking spaces that PDF text carries,
  # and those characters must appear literally in the normalisation tables.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "ASYNC"]
"app/db/seed*.py" = ["S105", "S106"]
"migrations/*" = ["I001", "N999"]
# S608 flags f-strings that *look* like SQL construction. Both of these build a
# migration script and a Markdown report from module constants and validated type
# names - never caller input - and the flagged expression is a multi-line f-string
# whose first line is inside the literal, so an inline noqa is not placeable.
"app/ai/embedding/migration_plan.py" = ["S608"]
"app/tools/system_diagnostics.py" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# -----------------------------------------------------------------------------
# mypy
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["app.ai.parsers.*", "app.ai.embedding.providers.*", "app.ai.rag.providers.*"]
# Optional third-party SDKs are imported lazily inside functions.
disallow_untyped_defs = true
ignore_errors = false

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: requires postgres + redis (run with `make test-integration`)",
  "slow: long-running test",
]
filterwarnings = [
  "error::DeprecationWarning:app.*",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py", "*/migrations/*", "app/core/telemetry.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
]
