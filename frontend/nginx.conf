## Nginx config for the built SPA.
##
## Two things here are not boilerplate:
##
## * `try_files ... /index.html` — the router owns the URL space, so a hard reload
##   of /contracts/<uuid> must serve the app rather than 404. Without it, every
##   deep link a user shares to a colleague is broken.
## * The API is proxied on the same origin. The refresh token is an HttpOnly,
##   SameSite cookie; served from a different origin it would either be dropped or
##   require CORS credentials plus SameSite=None, which is a materially weaker
##   position for no gain.

## Container DNS, re-consulted at runtime.
##
## An `upstream { server backend:8000; }` block resolves the name **once**, when
## the config loads. Container IPs are not stable - restart the backend and it
## comes back on a new address - so that one lookup goes stale and every request
## 502s with "connect() failed (113: Host is unreachable)" until nginx itself is
## restarted. Restarting the API must not take the site down with it.
##
## Putting the upstream in a variable forces a fresh lookup per request. The
## resolver address comes from the container's own /etc/resolv.conf, which the
## stock entrypoint script 15-local-resolvers.envsh exports as
## NGINX_LOCAL_RESOLVERS - so this works unchanged under both podman and docker,
## whose embedded DNS servers live at different addresses.
##
## That script is **opt-in**: it returns immediately unless
## NGINX_ENTRYPOINT_LOCAL_RESOLVERS is set, which the Dockerfile does. Without it
## envsubst leaves this line holding the literal variable name and nginx exits 1
## with `host not found in resolver "${NGINX_LOCAL_RESOLVERS}"`, serving nothing.
resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the version in the Server header.
    server_tokens off;

    # Server-scope so the docs locations below can share it. A `set` inside a
    # location is not visible to sibling locations, and a bare hostname in
    # proxy_pass would be resolved once at config load - the staleness the
    # resolver note at the top of this file exists to avoid.
    set $api_upstream_docs "${API_HOST}:${API_PORT}";

    # The app is same-origin and self-contained; no external scripts or styles.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # `text/javascript` as well as `application/javascript`: the .mjs location
    # below serves the former, and the pdf.js worker is ~1 MB uncompressed.
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml font/woff2;

    # ES modules, and the reason the PDF viewer broke in every deployment while
    # working perfectly in `vite dev`.
    #
    # nginx 1.27's bundled mime.types has NO entry for `.mjs`, so it falls to
    # `default_type application/octet-stream`. Browsers enforce strict MIME
    # checking on module scripts, and this server correctly sends
    # `X-Content-Type-Options: nosniff`, so the two combine into a hard refusal:
    #
    #   Failed to load module script: Expected a JavaScript-or-Wasm module script
    #   but the server responded with a MIME type of "application/octet-stream".
    #
    # pdf.js reacts by "Setting up fake worker", which then fails too, and the
    # viewer reports "This document could not be displayed." The document and the
    # API were never the problem - `GET /assets/pdf.worker.min-*.mjs` was.
    # Vite's dev server sends the right type, which is exactly why this is
    # invisible locally.
    #
    # Its own location, not a `types` block in `location /assets/`: a `types`
    # block REPLACES the inherited map rather than adding to it, so declaring one
    # where CSS, fonts and images are also served would turn all of them into
    # octet-stream. Scoped here it can only affect .mjs. A regex location also
    # takes precedence over the `/assets/` prefix match, so the immutable caching
    # is repeated rather than inherited.
    location ~* \.mjs$ {
        types { text/javascript mjs; }
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Hashed assets are immutable by construction, so they cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        # Variable, not a literal: see the resolver note at the top. With no path
        # component in proxy_pass, nginx forwards the original URI unchanged.
        set $api_upstream "${API_HOST}:${API_PORT}";
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: the Copilot streams token by token, and buffering would hold the
        # whole answer until the stream closed - which looks exactly like a hang.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 300s;

        # Contract uploads are large.
        client_max_body_size 120m;
    }

    # The API's own docs and schema, same-origin.
    #
    # Deployments commonly have exactly one port open inbound - this one - so
    # without these the interactive API documentation is simply unreachable and
    # the only way to exercise an endpoint by hand is an SSH tunnel. `/docs`
    # fetches `/openapi.json` from the same origin, so proxying one without the
    # other yields a Swagger page that renders and then fails to populate.
    #
    # These are exact matches: the SPA owns `/` via try_files, and a prefix match
    # on `/doc` would shadow any future client route beginning with those letters.
    location = /docs {
        proxy_pass http://$api_upstream_docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /redoc {
        proxy_pass http://$api_upstream_docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /openapi.json {
        proxy_pass http://$api_upstream_docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # There is no object-storage proxy here, deliberately.
    #
    # Document bytes are served by the API, from local filesystem storage, at
    # GET /api/v1/contracts/{contract_id}/content - which the `location /api/`
    # block above already proxies. So downloads are same-origin for free, with no
    # second upstream, no bucket name leaking into the URL space, and no presigned
    # URL whose signature has to survive a proxy hop intact.
    #
    # It also removes a trap worth remembering if object storage ever returns: the
    # proxy location was the bucket NAME, so a bucket called `contracts` would
    # shadow the SPA's own /contracts/<uuid> route and every download would answer
    # with the application's HTML at 200.

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
