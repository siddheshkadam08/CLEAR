## Nginx config for the built SPA.
##
## Two things here are not boilerplate:
##
## * `try_files ... /index.html` — the router owns the URL space, so a hard reload
##   of /contracts/<uuid> must serve the app rather than 404. Without it, every
##   deep link a user shares to a colleague is broken.
## * The API is proxied on the same origin. The refresh token is an HttpOnly,
##   SameSite cookie; served from a different origin it would either be dropped or
##   require CORS credentials plus SameSite=None, which is a materially weaker
##   position for no gain.

## Container DNS, re-consulted at runtime.
##
## An `upstream { server backend:8000; }` block resolves the name **once**, when
## the config loads. Container IPs are not stable - restart the backend and it
## comes back on a new address - so that one lookup goes stale and every request
## 502s with "connect() failed (113: Host is unreachable)" until nginx itself is
## restarted. Restarting the API must not take the site down with it.
##
## Putting the upstream in a variable forces a fresh lookup per request. The
## resolver address comes from the container's own /etc/resolv.conf, which the
## stock entrypoint script 15-local-resolvers.envsh exports as
## NGINX_LOCAL_RESOLVERS - so this works unchanged under both podman and docker,
## whose embedded DNS servers live at different addresses.
resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the version in the Server header.
    server_tokens off;

    # The app is same-origin and self-contained; no external scripts or styles.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Hashed assets are immutable by construction, so they cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The pdf.js worker is served from the same origin so the viewer works under a
    # strict CSP without a cross-origin worker exception.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        # Variable, not a literal: see the resolver note at the top. With no path
        # component in proxy_pass, nginx forwards the original URI unchanged.
        set $api_upstream "${API_HOST}:${API_PORT}";
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: the Copilot streams token by token, and buffering would hold the
        # whole answer until the stream closed - which looks exactly like a hang.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 300s;

        # Contract uploads are large.
        client_max_body_size 120m;
    }

    # Object storage, same-origin.
    #
    # Presigned download URLs are fetched by the browser, so the address they are
    # signed for has to be one a browser can actually reach. Publishing MinIO on
    # its own port would mean a second hole in the firewall and a second origin;
    # proxying it here keeps the deployment to one public port.
    #
    # `$http_host`, not `$host`: SigV4 signs the Host header *including the port*,
    # and `$host` drops it. Forwarding a host that differs by so much as the port
    # makes MinIO compute a different signature and reject every download with
    # SignatureDoesNotMatch. The URI is passed through unchanged for the same
    # reason - the signature covers the path.
    #
    # The location is the bucket name, and it must not collide with a route the
    # SPA owns. `/contracts/` would: the router serves /contracts/<uuid>.
    location /${STORAGE_BUCKET}/ {
        set $storage_upstream "${STORAGE_HOST}:${STORAGE_PORT}";
        proxy_pass http://$storage_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Documents are large and streamed to a PDF viewer that renders
        # progressively; buffering them whole adds latency for no benefit.
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 0;
        proxy_read_timeout 300s;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
