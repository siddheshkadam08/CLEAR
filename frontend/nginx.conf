## Nginx config for the built SPA.
##
## Two things here are not boilerplate:
##
## * `try_files ... /index.html` — the router owns the URL space, so a hard reload
##   of /contracts/<uuid> must serve the app rather than 404. Without it, every
##   deep link a user shares to a colleague is broken.
## * The API is proxied on the same origin. The refresh token is an HttpOnly,
##   SameSite cookie; served from a different origin it would either be dropped or
##   require CORS credentials plus SameSite=None, which is a materially weaker
##   position for no gain.

upstream api_backend {
    server ${API_HOST}:${API_PORT};
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the version in the Server header.
    server_tokens off;

    # The app is same-origin and self-contained; no external scripts or styles.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Hashed assets are immutable by construction, so they cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The pdf.js worker is served from the same origin so the viewer works under a
    # strict CSP without a cross-origin worker exception.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: the Copilot streams token by token, and buffering would hold the
        # whole answer until the stream closed - which looks exactly like a hang.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 300s;

        # Contract uploads are large.
        client_max_body_size 120m;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
