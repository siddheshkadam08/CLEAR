# CLEAR on BackendServerNew (4.213.198.238), under podman.
#
# Not an override of docker-compose.yml but a replacement for it, because almost
# everything that file provides is already running on this host:
#
#   Postgres        native, pid 674 on :5432 - also serving `rfp_intelligence`
#   layout parser   pdf_text_extractor on :8005, private IP only
#   object storage  /datadrive/blob, a 128G xfs disk - so no MinIO
#   queue           QUEUE_DRIVER=postgres uses the `stage_queue` table - so no
#                   Redis and no Node dispatcher
#
# What remains is three containers. That is not tidiness: the host has 3.8G of
# RAM with ~1.0G free, no swap, and two cores, already carrying the RFP stack
# (devrfpapi, rfpcelery, rfpbeat, rfpredis), mongod, dotnet and java. The seven
# containers the full compose starts would not fit.
#
#   podman-compose -f docker-compose.vm.yml up -d --build

x-env: &env
  APP_ENV: production
  DEBUG: "false"
  LOG_LEVEL: INFO
  LOG_FORMAT: json

  # Postgres is on the host, not in this network. `host.containers.internal` is
  # podman's gateway alias; the private IP is used instead because it is stable
  # and already how everything else on this box addresses the server.
  DATABASE_URL: postgresql+asyncpg://postgres:${PGPASSWORD}@172.1.0.7:5432/clear
  DB_SCHEMA: clear

  # No Redis, no Node dispatcher: stages are claimed from `clear.stage_queue`
  # with FOR UPDATE SKIP LOCKED.
  QUEUE_DRIVER: postgres

  # Our extractor, as a service. `format=adi` is its ADI *output shape* - the same
  # payload its CLI writes with `--adi` - not a call to Azure. Private IP: 8005 is
  # not published on the public interface.
  ACTIVE_PARSER: pdfextract
  PDFEXTRACT_URL: http://172.1.0.7:8005/extract?format=adi
  PDFEXTRACT_TIMEOUT_SECONDS: "1800"
  PARSER_MODE: live
  # Off deliberately. It defaults to true, and in production it writes the full
  # extracted text of every uploaded contract to disk for ever.
  PARSER_RECORD_FIXTURES: "false"

  # The blob disk, mounted below. `storage_path` values in the database are
  # relative to STORAGE_LOCAL_ROOT/STORAGE_CONTAINER, so this pair must stay
  # exactly as it is or every document viewer 404s.
  STORAGE_PROVIDER: local
  STORAGE_LOCAL_ROOT: /var/lib/cip/storage
  STORAGE_CONTAINER: contracts

  # The extractor reports maxUploadMB: 50. Matching it here means an oversized
  # file is refused at upload rather than after it has been stored and queued.
  MAX_UPLOAD_SIZE_MB: "50"
  ALLOWED_FILE_TYPES: pdf,doc,docx,zip

  JWT_SECRET: ${JWT_SECRET}
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
  CORS_ORIGINS: http://4.213.198.238:5173

  LLM_PROVIDER: openai
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL}
  LLM_MODEL: ${LLM_MODEL}
  LLM_MODEL_SIMPLE: ${LLM_MODEL}
  LLM_MODEL_COMPLEX: ${LLM_MODEL}

  EMBEDDING_PROVIDER: azure_openai
  EMBEDDING_MODEL: text-embedding-3-small
  EMBEDDING_DIM: "1536"
  AZURE_OPENAI_EMBEDDING_ENDPOINT: ${AZURE_OPENAI_EMBEDDING_ENDPOINT}
  AZURE_OPENAI_EMBEDDING_API_KEY: ${AZURE_OPENAI_EMBEDDING_API_KEY}
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT: text-embedding-3-small
  AZURE_OPENAI_EMBEDDING_API_VERSION: "2024-02-01"

  OTEL_ENABLED: "false"

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  backend:
    build: { context: ./backend, dockerfile: Dockerfile, target: runtime }
    container_name: cip-backend
    environment: *env
    ports:
      - "8010:8000"
    volumes:
      - /datadrive/blob/CIP_Demo:/var/lib/cip/storage:z
    restart: unless-stopped
    logging: *logging

  # One worker for every stage. The compose file splits parser and AI workers so
  # a slow parse cannot starve extraction, which is right on a machine with room
  # for it; here a second worker would cost more memory than the isolation is
  # worth. WORKER_ROLE=all is the supported single-pool mode.
  worker:
    build: { context: ./backend, dockerfile: Dockerfile, target: runtime }
    container_name: cip-worker
    environment:
      <<: *env
      WORKER_ROLE: all
      OTEL_SERVICE_NAME: cip-worker
    command: ["uvicorn", "app.worker_app:app", "--host", "0.0.0.0", "--port", "8001"]
    volumes:
      - /datadrive/blob/CIP_Demo:/var/lib/cip/storage:z
    depends_on: [backend]
    restart: unless-stopped
    logging: *logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        # `/api/v1` is the Dockerfile default and the right one: it keeps the
        # browser on the same origin, so nginx proxies the API and the deployment
        # needs no CORS exception and no second public port.
        VITE_API_BASE_URL: /api/v1
        VITE_ENABLE_MICROSOFT_SSO: "false"
        # nginx proxies /api/ to this upstream, resolved on the compose network.
        API_HOST: backend
        API_PORT: "8000"
    container_name: cip-frontend
    environment:
      API_HOST: backend
      API_PORT: "8000"
    ports:
      - "5173:8080"
    depends_on: [backend]
    restart: unless-stopped
    logging: *logging
