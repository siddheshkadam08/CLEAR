global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: contract-intelligence

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: cip-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          component: api

  - job_name: cip-workers
    metrics_path: /metrics
    static_configs:
      - targets: ["worker-parser:8001", "worker-ai:8001"]
        labels:
          component: worker

  - job_name: cip-queue
    metrics_path: /metrics
    static_configs:
      - targets: ["queue:9100"]
        labels:
          component: queue

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          component: telemetry
