## CLEAR - host reverse proxy and TLS termination.
##
## Install:  /etc/nginx/sites-available/clear.conf  (Debian/Ubuntu, then symlink
##           into sites-enabled) or /etc/nginx/conf.d/clear.conf (RHEL family).
##
## Why there is a second nginx at all
## ---------------------------------
## The frontend CONTAINER already runs nginx: it serves the SPA and proxies /api
## and the storage bucket, so the whole application is one origin. This one exists
## for two things that container cannot do:
##
##   * Bind 80 and 443. The stack runs rootless, and a rootless container cannot
##     bind a privileged port without granting the capability to do it. Terminating
##     here means it never needs to.
##   * Terminate TLS. Certificates are host state - renewed by certbot, readable
##     only by root - and putting them inside a container that is replaced on every
##     deploy would mean re-mounting them on every deploy.
##
## So: internet -> this nginx (TLS) -> 127.0.0.1:8080 (frontend container) -> API
## and object storage over the podman network. One public port, one origin, and
## the HttpOnly refresh cookie stays first-party the whole way.
##
## Replace clear.example.com throughout. <<< REQUIRES CONFIRMATION

# The frontend container, published on loopback by clear-frontend.container.
#
# A literal address, not a hostname: this upstream never moves, and unlike the
# container-to-container case there is no DNS to go stale.
upstream clear_frontend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP: ACME, then redirect
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name clear.example.com;

    # Left reachable over plain HTTP on purpose: certbot's HTTP-01 challenge is
    # fetched before there is a certificate to redirect to.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name clear.example.com;

    # certbot --nginx rewrites these four lines in place.
    ssl_certificate     /etc/letsencrypt/live/clear.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clear.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;

    # HSTS. Only once the certificate is known good - a bad one plus HSTS locks
    # every browser that has visited out of the site for max-age seconds.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # The frontend container sets X-Frame-Options, Referrer-Policy and the rest.
    # They are not repeated here: `add_header` in a server block REPLACES the
    # whole inherited set rather than adding to it, and duplicating them is how
    # they drift apart.

    # Larger than MAX_UPLOAD_SIZE_MB (50) and equal to the frontend container's
    # own client_max_body_size, so a request that is going to be refused is
    # refused by the API - which returns a JSON error the UI can show - rather
    # than by nginx, which returns an HTML 413 the UI cannot parse.
    client_max_body_size 120m;
    client_body_timeout 300s;

    access_log /var/log/nginx/clear.access.log;
    error_log  /var/log/nginx/clear.error.log warn;

    # -----------------------------------------------------------------------
    # Everything: the SPA, /api, /docs and the storage bucket, all of which the
    # frontend container routes internally.
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://clear_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The application is behind TLS it cannot see. Without this header every
        # absolute URL it generates comes out as http://, which breaks the OIDC
        # redirect against a registration that lists https:// - and the error
        # comes from Entra, naming a redirect_uri mismatch, not from here.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Empty, not "close": keepalive to the upstream requires it, and the
        # `upstream` block above sets up a keepalive pool.
        proxy_set_header Connection "";

        # Off for the whole server rather than only for /api/.
        #
        # The Copilot answers over SSE, token by token: with buffering on, nginx
        # holds the entire response until the stream closes, which is
        # indistinguishable from a hang. Documents are streamed to a PDF viewer
        # that renders progressively, so buffering them whole adds latency for
        # nothing. Everything else this upstream serves is a small static asset
        # over loopback, where buffering saves nothing worth the exception.
        proxy_buffering off;
        proxy_cache off;

        # Long enough for an export of a large portfolio and for an SSE stream
        # that is thinking. The API's own gunicorn timeout is 120s for ordinary
        # requests; this must not be the thing that cuts a stream short.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # /metrics is Prometheus text from the API. The frontend container does not
    # proxy it, so it is already unreachable from here - stated so that nobody
    # adds a location for it without deciding who may read it.
}
